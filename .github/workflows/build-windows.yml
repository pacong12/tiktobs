name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # bisa dijalankan manual dari tab Actions

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: python build_exe.py

      - name: Extract version
        id: get_version
        shell: bash
        run: |
          VERSION=$(python -c "import app.version; print(app.version.__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTokOBS-v${{ steps.get_version.outputs.version }}-windows
          path: dist/TikTokOBS-*.exe
          if-no-files-found: error
