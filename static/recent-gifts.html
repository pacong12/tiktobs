<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Recent Gifts Overlay</title>
    <link rel="stylesheet" href="recent-gifts-style.css">
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="feed-container">
        <div class="feed-header">
            <span class="feed-title">🎉 Recent Gifts</span>
            <span class="feed-count" id="feed-count">0</span>
        </div>
        <div class="gifts-list" id="gifts-list">
            <div class="empty-placeholder" id="empty-placeholder">
                Waiting for live gifts...
            </div>
        </div>
    </div>

    <script src="auth.js?v=1"></script>
    <script src="recent-gifts.js"></script>
</body>
</html>
