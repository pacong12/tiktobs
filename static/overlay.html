<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok LIVE Gift Leaderboard Overlay</title>
    <link rel="stylesheet" href="overlay-style.css?v=2">
    <!-- Google Fonts Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="leaderboard-container" class="leaderboard-container">
        <div class="leaderboard-header">
            <span class="header-icon">🏆</span>
            <h2 class="header-title">TOP SENDER</h2>
        </div>
        <div class="scope-toggle">
            <button id="scope-session-btn" class="scope-btn active" type="button">Sesi Ini</button>
            <button id="scope-all-btn" class="scope-btn" type="button">Riwayat</button>
        </div>
        <ul id="leaderboard-list" class="leaderboard-list">
            <li class="empty-state">Waiting for gifts...</li>
        </ul>
    </div>
    
    <script src="auth.js?v=1"></script>
    <script src="overlay.js?v=2"></script>
</body>
</html>
