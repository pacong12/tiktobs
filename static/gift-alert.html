<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Gift Alert Overlay</title>
    <link rel="stylesheet" href="gift-alert-style.css">
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- GIFT POPUP CARD -->
    <div class="alert-card" id="alert-card">
        <div class="gift-icon-container">
            <span class="gift-emoji" id="gift-emoji">🎁</span>
        </div>
        <div class="alert-user" id="alert-user">SenderName</div>
        <div class="alert-action">Sent a Gift!</div>
        <div class="alert-gift-name" id="alert-gift-name">Super Gift</div>
        <div class="alert-combo id" id="alert-combo" style="display: none;">x1</div>
    </div>

    <!-- Instructions / Directory info for uploaded sound files -->
    <!-- Sound will be looked up at: sounds/gift-alert.wav or sounds/gift-alert.mp3 -->

    <script src="auth.js?v=1"></script>
    <script src="gift-icons.js?v=2"></script>
    <script src="gift-alert.js?v=4"></script>
</body>
</html>
